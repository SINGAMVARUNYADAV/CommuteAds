<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Console | CommuteAds</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { brand: { lightBg: '#f8fafc', lightCard: '#ffffff', lightBorder: '#e2e8f0', darkBg: '#09090b', darkCard: '#141417', darkBorder: '#27272a', accent: '#3b82f6' } }
                }
            }
        }
    </script>
</head>
<body class="bg-brand-lightBg dark:bg-brand-darkBg text-gray-800 dark:text-gray-300 font-sans p-6 md:p-12 transition-colors duration-300">

    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-10 border-b border-brand-lightBorder dark:border-brand-darkBorder pb-6">
            <div>
                <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Admin Dashboard</h1>
                <p class="text-sm text-gray-500 mt-1">Manage incoming leads and system stats.</p>
            </div>
            <a href="login.html" class="border border-gray-300 dark:border-zinc-700 px-4 py-2 rounded-lg text-sm font-medium bg-white dark:bg-zinc-800 hover:bg-gray-50 dark:hover:bg-zinc-700 text-gray-800 dark:text-gray-200 transition">Log Out</a>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            <div class="bg-brand-lightCard dark:bg-brand-darkCard border border-brand-lightBorder dark:border-brand-darkBorder p-6 rounded-2xl shadow-sm">
                <span class="text-xs uppercase font-bold text-gray-500 tracking-wider">Total Leads</span>
                <div class="text-4xl font-extrabold text-gray-900 dark:text-white mt-2" id="totalLeads">0</div>
            </div>
            <div class="bg-brand-lightCard dark:bg-brand-darkCard border border-brand-lightBorder dark:border-brand-darkBorder p-6 rounded-2xl shadow-sm">
                <span class="text-xs uppercase font-bold text-gray-500 tracking-wider">Estimated Revenue</span>
                <div class="text-4xl font-extrabold text-green-500 mt-2" id="estRevenue">₹0</div>
            </div>
            <div class="bg-brand-lightCard dark:bg-brand-darkCard border border-brand-lightBorder dark:border-brand-darkBorder p-6 rounded-2xl shadow-sm">
                <span class="text-xs uppercase font-bold text-gray-500 tracking-wider">Active Screens</span>
                <div class="text-4xl font-extrabold text-brand-accent mt-2">100</div>
            </div>
        </div>

        <div class="bg-brand-lightCard dark:bg-brand-darkCard border border-brand-lightBorder dark:border-brand-darkBorder rounded-2xl overflow-hidden shadow-sm">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 dark:bg-zinc-900 border-b border-gray-200 dark:border-zinc-800 text-xs uppercase font-bold text-gray-500 dark:text-gray-400">
                            <th class="p-4">Date</th>
                            <th class="p-4">Company & Name</th>
                            <th class="p-4">Requested Fleet</th>
                            <th class="p-4">GSTIN</th>
                            <th class="p-4">Contact</th>
                        </tr>
                    </thead>
                    <tbody id="dashboardTableBody" class="divide-y divide-gray-200 dark:divide-zinc-800 text-sm">
                        <tr><td colspan="5" class="p-8 text-center text-gray-500">Loading leads...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Your real Supabase keys (https:// added to the URL!)
        const supabaseUrl = 'https://db.comcsxznnlehfywdqdyx.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNvbWNzeHpubmxlaGZ5d2RxZHl4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3MDgzOTEsImV4cCI6MjA5OTI4NDM5MX0.fZtM9AKMdDAEJGAVGqjhPK6qynFVkGAZu1bu8zaca_o';
        
        // Using 'supabaseClient' to prevent the naming collision error
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        document.getElementById('prebookForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const status = document.getElementById('formStatus');
            btn.textContent = 'Processing...'; btn.disabled = true;

            const payload = {
                name: document.getElementById('name').value,
                company: document.getElementById('company').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                tier: document.getElementById('tier').value,
                gstin: document.getElementById('gstin').value || 'N/A'
            };

            // Sending data to your newly created 'prebooks' table
            const { error } = await supabaseClient.from('prebooks').insert([payload]);
            
            status.classList.remove('hidden');
            if (error) {
                status.textContent = 'Error processing booking form.'; 
                status.className = 'text-center text-sm text-red-500 mt-4';
                console.error("Supabase Error:", error); 
            } else {
                status.textContent = 'Success! We will be in touch shortly.'; 
                status.className = 'text-center text-sm text-green-500 mt-4 font-medium';
                document.getElementById('prebookForm').reset();
            }
            btn.textContent = 'Submit Details'; btn.disabled = false;
        });
    </script>
</body>
</html>
